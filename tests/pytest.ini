# E2E-only config (lives next to ``e2e/``). Run from the ``tests`` directory so only
# ``tests/e2e`` is collected:
#   cd tests && uv run pytest -c pytest.ini e2e/ -v
#
# From repo root, target the file or folder explicitly (otherwise pytest may pick this ini
# and still collect sibling modules under ``tests/``):
#   uv run pytest tests/e2e/scenarios/test_pod_lifecycle_email_received_workflow.py -v
#
# ``test_pod_lifecycle_email_received_unipile_webhook`` waits 4 minutes after the webhook
# (fire-and-forget); allow ~5+ minutes wall time when running that scenario.

[pytest]
pythonpath = ..
testpaths = e2e
asyncio_mode = auto
addopts = -p pytest_order

markers =
    e2e: ordered workflow MVP tests under tests/e2e
    integration: tests that require live or seeded integration prerequisites
    order: execution order for pytest-order
    ratecon_workflow: MVP ratecon via Unipile webhook
    pod_lifecycle_route_workflow: MVP pod_lifecycle route_completed via Turvo webhook
    pod_lifecycle_email_workflow: MVP pod_lifecycle email_received (POD reply) via Unipile webhook
    pod_lifecycle_email_catch_up_workflow: opt-in pod_lifecycle email_received Celery-direct + fixture stubs E2E
    driver_assignment_catch_up_workflow: opt-in driver_assignment ratecon_completed + catch-up reminders E2E

# E2E tests import ``app.main:app`` (FastAPI). The app still uses deprecated
# ``@app.on_event("startup"|"shutdown")`` (Starlette/FastAPI now prefer a single
# ``lifespan`` context on ``FastAPI(...)``). Registering those hooks emits
# ``DeprecationWarning`` from ``starlette.*`` / ``fastapi.*`` on import and when
# TestClient runs the app. Pytest surfaces every warning in the summary, which
# drowns real signal for this suite. These filters silence only that category
# from those packages—not app code warnings.
#
# Long-term: remove this block after migrating ``app/main.py`` to ``lifespan``
# and deleting ``on_event`` handlers; then warnings stay visible again.
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*