[project]
name = "freightx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cryptography>=46.0.0",
    "celery>=5.5.3",
    "fastapi>=0.128.8",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "langgraph>=0.6.11",
    "langgraph-checkpoint-postgres>=2.0.25",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.11.0",
    "psycopg[binary]>=3.2.13",
    "redis>=5.0.0",
    "uvicorn>=0.39.0",
    "redis>=7.4.0",
    "langgraph-cli[inmem]>=0.4.24",
    "langsmith>=0.7.32",
    "python-dotenv>=1.2.2",
    "logfire[fastapi,httpx,psycopg]>=4.32.1",
    "boto3>=1.42.96",
    "openai>=2.33.0",
    "img2pdf>=0.6.3",
    "pikepdf>=10.5.1",
    "pillow>=12.2.0",
    "pdf2image>=1.17.0",
    "poppler-utils>=0.1.0",
    "thefuzz>=0.22.1",
    "pillow-heif>=1.3.0",
    "pytest-order>=1.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pgeocode>=0.5.0",
    "sqlalchemy>=2.0.44",
    "langchain-core>=1.3.2",
    "langgraph-api>=0.10.0",
]

[dependency-groups]
dev = [
    "alembic>=1.17.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["TCH"]
