name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - feat/appointment-scheduling

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    # Dummy values so Settings() can load; suite mocks DB/HTTP.
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_NAME: freightx_test
      DATABASE_USER: test
      DATABASE_PASSWORD: test
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      UNIPILE_API_KEY: test-unipile-key
      UNIPILE_DSN: test-unipile-dsn
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      BUCKET_NAME: test-bucket
      UNIPILE_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run appointment scheduling and related feature tests
        run: >
          uv run pytest -q
          tests/test_appointment_scheduling*.py
          tests/test_notify_appointment_draft_teams_node.py
          tests/test_t3ra_inbound_email_service.py
          tests/test_t3ra_turvo.py
          tests/test_appointment_scheduling_send_api.py
          tests/test_communications_appointment_reply_thread.py
