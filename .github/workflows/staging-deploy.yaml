name: Deploy backend to Amazon ECS Staging

on:
  push:
    branches:
      - staging

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: freightx-agents-backend
  ECS_CLUSTER: freightx-staging-cluster
  BLUE_SERVICE: staging-freightx-agents-service-gq43l3i5
  GREEN_SERVICE: staging-freightx-agents-green-service-usd9ma0a

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1
    
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    # --------------------------------------------------------- 
    # DEPLOY BLUE ENVIRONMENT 
    # --------------------------------------------------------- 
    - name: Force ECS to deploy new image to Blue Service 
    run: | 
      aws ecs update-service \
        --cluster ${{ env.ECS_CLUSTER }} \
        --service ${{ env.BLUE_SERVICE }} \
        --force-new-deployment

    - name: Wait for Blue Service to become stable
    run: |
      aws ecs wait services-stable \
        --cluster ${{ env.ECS_CLUSTER }} \
        --services ${{ env.BLUE_SERVICE }}
    
    # --------------------------------------------------------- 
    # DEPLOY GREEN ENVIRONMENT 
    # --------------------------------------------------------- 

    - name: Force ECS to deploy new image to Green Service
    run: |
      aws ecs update-service \
        --cluster ${{ env.ECS_CLUSTER }} \
        --service ${{ env.GREEN_SERVICE }} \
        --force-new-deployment

    - name: Wait for Green Service to become stable
    run: |
      aws ecs wait services-stable \
        --cluster ${{ env.ECS_CLUSTER }} \
        --services ${{ env.GREEN_SERVICE }}